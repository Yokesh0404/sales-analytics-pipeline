# Airflow for the Olist pipeline, based on the official Airflow 3.3.2 docker-compose,
# slimmed down for one laptop:
#   - LocalExecutor: tasks run inside the scheduler container (no Celery/Redis/workers)
#   - no triggerer (our DAG has no "deferrable" tasks)
#
# Run from the airflow/ folder:
#   docker compose --env-file ../.env up -d --build
# --env-file ../.env lets ${...} below read values from the project's .env file,
# so no password is written in this file.

x-airflow-common: &airflow-common
  build:
    context: ..                    # project root, so the Dockerfile can copy requirements.txt
    dockerfile: airflow/Dockerfile
  image: olist-airflow:3.3.2
  environment: &airflow-common-env
    # --- Airflow settings ---
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"              # don't show Airflow's demo DAGs
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true" # new DAGs start paused until you switch them on
    AIRFLOW__CORE__PARALLELISM: "4"                    # max tasks at once (keeps memory low)
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # --- Connection to YOUR PostgreSQL on the laptop (used by our scripts and dbt) ---
    # host.docker.internal is Docker Desktop's name for "the computer running Docker".
    POSTGRES_HOST: host.docker.internal
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  volumes:
    - ./dags:/opt/airflow/dags              # our DAG files
    - ./logs:/opt/airflow/logs              # Airflow task logs, visible on the laptop
    - ../src:/opt/project/src:ro            # pipeline scripts (read-only)
    - ../dbt:/opt/project/dbt               # dbt project (writable: dbt writes target/ and logs/)
    - ../data:/opt/project/data:ro          # raw CSVs (read-only)
    - ../logs:/opt/project/logs             # ingestion.log / quality.log
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  # Airflow's OWN database: stores DAG runs, task states, users. Not the olist data.
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data   # keeps run history across restarts
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # One-off setup: create/upgrade Airflow's database tables and the admin user, then exit.
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?set AIRFLOW_ADMIN_USERNAME in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}

  # The web UI + REST API at http://localhost:8080
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 60s   # the CLI-based check is slow on a small laptop
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Decides WHEN each task should run, and (LocalExecutor) runs it.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 60s   # the CLI-based check is slow on a small laptop
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Reads the Python files in dags/ and turns them into DAGs Airflow knows about.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 60s   # the CLI-based check is slow on a small laptop
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-volume:
